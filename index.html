<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Pendaftaran Klub JKT48 Fans</title>
    <link rel="stylesheet" href="style.css">
</head>
<body>

    <div class="form-card">

        <div class="form-header">
            <span class="badge">🚀 JKT48 Operation Tim</span>
            <h2>Join JKT48 Club</h2>
            <p>Daftarkan dirimu dan mulai bikin web keren bersama!</p>
        </div>

        <form>
            <div class="input-group">
                <label for="nama">Nama Lengkap</label>
                <input type="text" id="nama" placeholder="Contoh: Abigail Rachel" required>
            </div>

            <div class="input-group">
                <label for="kelas">Kelas</label>
                <input type="text" id="kelas" placeholder="Contoh: Generasi 12 JKT48" required>
            </div>

            <div class="input-group">
                <label for="alasan">Kenapa ingin bergabung?</label>
                <textarea id="alasan" rows="3" placeholder="Tulis alasan singkatmu di sini..." required></textarea>
            </div>

            <button type="submit" class="btn-submit">Kirim Pendaftaran ✨</button>
        </form>

    </div>

</body>
</html>
